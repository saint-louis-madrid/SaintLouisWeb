<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Saint Louis des Français</title>
</head>
<body>
  <!-- Scripts de Netlify Identity y Decap CMS -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Autenticación Netlify Identity -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

  <!-- Botón "Publicar todo lo pendiente" (Sincronizado) -->
  <script>
    function gestionarBotonPublicarTodo() {
      const esWorkflow = window.location.hash.includes('workflow');
      const botonExistente = document.getElementById('btn-publicar-todo-cms');

      if (esWorkflow && !botonExistente) {
        const btn = document.createElement('button');
        btn.id = 'btn-publicar-todo-cms';
        btn.innerHTML = '🚀 Publicar todo lo pendiente';
        
        btn.style.cssText = `
          position: fixed;
          bottom: 28px;
          right: 28px;
          z-index: 99999;
          background-color: #2563eb;
          color: #ffffff;
          border: none;
          padding: 12px 22px;
          border-radius: 8px;
          font-weight: 600;
          font-size: 15px;
          cursor: pointer;
          box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
          transition: transform 0.2s, background-color 0.2s;
        `;

        btn.onmouseover = () => {
          btn.style.backgroundColor = '#1d4ed8';
          btn.style.transform = 'scale(1.03)';
        };
        btn.onmouseout = () => {
          btn.style.backgroundColor = '#2563eb';
          btn.style.transform = 'scale(1)';
        };

        btn.onclick = async () => {
          const obtenerBotonesPublicar = () => {
            return Array.from(document.querySelectorAll('button')).filter(b => 
              /publish|publicar/i.test(b.textContent || '') && b.id !== 'btn-publicar-todo-cms'
            );
          };

          let botonesIniciales = obtenerBotonesPublicar();
          if (botonesIniciales.length === 0) {
            alert('No hay tarjetas pendientes de publicar en la columna Ready.');
            return;
          }

          if (!confirm(`¿Confirmas la publicación secuencial de los cambios acumulados?`)) {
            return;
          }

          btn.disabled = true;
          btn.style.opacity = '0.6';
          let contador = 0;

          while (true) {
            const botonesActuales = obtenerBotonesPublicar();
            if (botonesActuales.length === 0) break;

            contador++;
            btn.innerHTML = `⏳ Publicando cambio ${contador}...`;

            // Ejecuta el clic en la tarjeta disponible
            botonesActuales[0].click();

            // Esperar a la confirmación de éxito ("Entry published") y sincronización con Git Gateway
            await new Promise(resolve => {
              let tiempoTranscurrido = 0;
              const intervalo = setInterval(() => {
                tiempoTranscurrido += 400;
                const hayExito = document.body.innerText.includes('Entry published') || 
                                document.body.innerText.includes('Entrada publicada');

                // Al confirmarse la publicación o tras 5 segundos de margen, se da paso al siguiente
                if (hayExito || tiempoTranscurrido >= 5000) {
                  clearInterval(intervalo);
                  // Pausa de 2.5 segundos para refrescar el estado de Redux en Decap
                  setTimeout(resolve, 2500);
                }
              }, 400);
            });
          }

          btn.innerHTML = '🚀 Publicar todo lo pendiente';
          btn.disabled = false;
          btn.style.opacity = '1';
        };

        document.body.appendChild(btn);
      } else if (!esWorkflow && botonExistente) {
        botonExistente.remove();
      }
    }

    window.addEventListener('hashchange', gestionarBotonPublicarTodo);
    const observadorDOM = new MutationObserver(gestionarBotonPublicarTodo);
    observadorDOM.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
