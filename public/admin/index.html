<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Saint Louis des Français</title>
</head>
<body>
  <!-- Scripts de Netlify Identity y Decap CMS -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Autenticación Netlify Identity -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

  <!-- Botón "Publicar todo lo pendiente" (Secuencial Inteligente) -->
  <script>
    function gestionarBotonPublicarTodo() {
      const esWorkflow = window.location.hash.includes('workflow');
      const botonExistente = document.getElementById('btn-publicar-todo-cms');

      if (esWorkflow && !botonExistente) {
        const btn = document.createElement('button');
        btn.id = 'btn-publicar-todo-cms';
        btn.innerHTML = '🚀 Publicar todo lo pendiente';
        
        btn.style.cssText = `
          position: fixed;
          bottom: 28px;
          right: 28px;
          z-index: 99999;
          background-color: #2563eb;
          color: #ffffff;
          border: none;
          padding: 12px 22px;
          border-radius: 8px;
          font-weight: 600;
          font-size: 15px;
          cursor: pointer;
          box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
          transition: transform 0.2s, background-color 0.2s;
        `;

        btn.onmouseover = () => {
          btn.style.backgroundColor = '#1d4ed8';
          btn.style.transform = 'scale(1.03)';
        };
        btn.onmouseout = () => {
          btn.style.backgroundColor = '#2563eb';
          btn.style.transform = 'scale(1)';
        };

        btn.onclick = async () => {
          // Obtener los botones de publicación presentes en el DOM
          let botones = Array.from(document.querySelectorAll('button')).filter(b => 
            /publish|publicar/i.test(b.textContent || '') && b.id !== 'btn-publicar-todo-cms'
          );

          if (botones.length === 0) {
            alert('No hay tarjetas pendientes de publicar en la columna Ready.');
            return;
          }

          const total = botones.length;
          if (!confirm(`¿Confirmas la publicación de los ${total} cambios acumulados?`)) {
            return;
          }

          // Deshabilitar temporalmente el botón mientras se procesa
          btn.disabled = true;
          btn.style.opacity = '0.6';

          for (let i = 0; i < total; i++) {
            // Re-escaneamos el DOM en cada iteración para obtener el botón actualizado
            const botonesActuales = Array.from(document.querySelectorAll('button')).filter(b => 
              /publish|publicar/i.test(b.textContent || '') && b.id !== 'btn-publicar-todo-cms'
            );

            if (botonesActuales.length > 0) {
              btn.innerHTML = `⏳ Publicando ${i + 1} de ${total}...`;
              botonesActuales[0].click(); // Publica el primero de la lista actual
              
              // Esperar 3 segundos para dar tiempo a la red y al renderizado de Decap CMS
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }

          btn.innerHTML = '🚀 Publicar todo lo pendiente';
          btn.disabled = false;
          btn.style.opacity = '1';
        };

        document.body.appendChild(btn);
      } else if (!esWorkflow && botonExistente) {
        botonExistente.remove();
      }
    }

    window.addEventListener('hashchange', gestionarBotonPublicarTodo);
    const observadorDOM = new MutationObserver(gestionarBotonPublicarTodo);
    observadorDOM.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
